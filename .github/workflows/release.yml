name: Autorelease on Tags

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"   # semantic version tags only

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build browser extension
        run: |
          npm ci
          npm run build
          cd dist
          zip -r ../extension-${GITHUB_REF_NAME}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: extension-${{ github.ref_name }}.zip
          prerelease: ${{ endsWith(github.ref_name, '.0') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
